<!--
Git is a version control system that allows multiple developers to work on a project simultaneously without interfering with each other's changes. It keeps track of changes made to files and allows users to revert to previous versions if needed.

Key concepts in Git include:

1. Repository: A Git repository (or repo) is a directory that contains all the files and their version history. It can be local (on your machine) or remote (on a server).

2. Commit: A commit is a snapshot of the changes made to the files in the repository. Each commit has a unique ID and includes a message describing the changes.

3. Branch: A branch is a separate line of development within a repository. It allows developers to work on new features or bug fixes without affecting the main codebase.

4. Merge: Merging is the process of combining changes from one branch into another. This is often done when a feature is complete and ready to be integrated into the main codebase.

5. Remote: A remote is a version of the repository that is hosted on a server. Developers can push their changes to a remote repository and pull changes made by others.

6. Clone: Cloning is the process of creating a local copy of a remote repository. This allows developers to work on the project offline and sync their changes later.

7. Pull Request: A pull request is a request to merge changes from one branch into another. It allows other developers to review the changes before they are merged.

Overall, Git is a powerful tool for collaboration and version control in software development.
-->

<!--
there are 3 area of git
1. working directory: where we do our work, make changes to files, like write code, add images, delete files etc, make different html cs js files etc
2. staging area: when we are done with our work, we stage the changes, means we prepare the changes to be committed, we can stage specific files or all files, staging is like saying "these changes are ready to be saved". for that we use plus sign in git gui or git add . in terminal, or in commit section of git gui
3. local repository: when we commit the changes, they are saved in the repository, which is a hidden .git folder in our project directory.
4. remote repository: its a copy of our local repository, hosted on a server like github, gitlab, bitbucket etc, so that we can share our code with others, collaborate on projects, and keep a backup of our work. we can push our changes to remote repository using git push command in terminal or push button in git gui. the changes can be made in the terminal as well as source control tab of vscode. in remote we have the version of our code, so if we make any mistake in local repo, we can always go back to remote repo and get the previous version of our code.

 CLI: command line interface, its a text based way of interacting with git, like git bash, terminal etc, where we can type commands to do the same things as in gui, like git add, git commit, git push etc. meaning typing commands in terminal or command prompt. CLI is more powerful and flexible than GUI, but it requires more knowledge and practice to use it effectively.
